fleets:
  internal:
    listeners:
      one:
        hostname: one.example.com
        gatewayName: one
        tls:
          secretName: shared-tls
        certificate:
          name: one-certificate
          issuerRef:
            name: internal-ca
            kind: ClusterIssuer
            group: cert-manager.io
      two:
        hostname: two.example.com
        gatewayName: two
        tls:
          secretName: shared-tls
        certificate:
          name: two-certificate
          issuerRef:
            name: internal-ca
            kind: ClusterIssuer
            group: cert-manager.io
