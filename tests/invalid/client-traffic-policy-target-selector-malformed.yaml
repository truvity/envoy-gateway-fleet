fleets:
  internal:
    listeners:
      test:
        hostname: api.example.com
        certificate: {enabled: false}
        clientTrafficPolicy:
          enabled: true
          targetSelectors:
            - group: gateway.networking.k8s.io
              kind: Gateway
              matchExpressions:
                - key: example.com/disabled
                  operator: DoesNotExist
                  values: [not-allowed]
