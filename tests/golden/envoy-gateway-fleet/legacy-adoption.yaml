---
# Source: envoy-gateway-fleet/templates/listeners.yaml
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  secretName: argocd-server-tls
  dnsNames:
    - "argocd.internal.example.com"
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: internal-ca

---
# Source: envoy-gateway-fleet/templates/listeners.yaml
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: tls-baseline
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  targetSelectors:
    - group: gateway.networking.k8s.io
      kind: Gateway
      matchLabels:
        example.com/tls-baseline: strict
  tls:
    maxVersion: "1.3"
    minVersion: "1.3"

---
# Source: envoy-gateway-fleet/templates/listeners.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: argocd
  namespace: argocd
  labels:
    example.com/tls-baseline: strict
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
    external-dns.alpha.kubernetes.io/hostname: argocd.internal.example.com
spec:
  gatewayClassName: internal
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: argocd-server-tls
      hostname: "argocd.internal.example.com"
      allowedRoutes:
        kinds:
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
        namespaces:
          from: Same
